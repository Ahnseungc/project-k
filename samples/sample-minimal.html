<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>샘플 03 미니멀 브리즈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Pretendard:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        color: #1d2435;
        font-family: "Pretendard", sans-serif;
        background:
          radial-gradient(circle at 12% 12%, rgba(157, 184, 255, 0.26) 0%, rgba(157, 184, 255, 0) 43%),
          radial-gradient(circle at 84% 16%, rgba(198, 185, 255, 0.26) 0%, rgba(198, 185, 255, 0) 43%),
          linear-gradient(160deg, #eef4ff 0%, #f8fbff 48%, #f1f5ff 100%);
      }
      .wrap { max-width: 440px; margin: 0 auto; padding: 24px 14px 40px; }
      .card {
        background: linear-gradient(140deg, rgba(255, 255, 255, 0.72), rgba(246, 250, 255, 0.5));
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.74);
        padding: 24px 18px;
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        box-shadow: 0 10px 22px rgba(44, 72, 141, 0.12);
      }
      .kicker { font-size: 0.75rem; letter-spacing: .12em; color: #4864a8; text-transform: uppercase; }
      .title { font-family: "Nanum Myeongjo", serif; font-size: 2rem; margin: 10px 0 16px; line-height: 1.4; }
      .photo { width: 100%; border-radius: 12px; display: block; margin-bottom: 16px; }
      .muted { color: #586079; line-height: 1.7; font-size: 0.93rem; }
      .back { margin-top: 14px; display: inline-block; color: #4864a8; }
      .music-btn {
        position: fixed;
        right: 16px;
        bottom: 16px;
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        background: linear-gradient(140deg, rgba(72, 100, 168, 0.94), rgba(90, 87, 188, 0.94));
        box-shadow: 0 10px 24px rgba(55, 74, 138, 0.24);
        color: #fff;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <p class="kicker">Simple Invitation</p>
        <h1 class="title">결혼합니다<br />함께 축복해주세요</h1>
        <img class="photo" src="https://images.unsplash.com/photo-1519225421980-715cb0215aed?q=80&w=1300&auto=format&fit=crop" alt="웨딩 테이블 세팅 사진" />
        <p class="muted">깔끔한 타이포 중심 구성과 밝은 색감으로, 누구나 읽기 편한 모바일 청첩장 샘플입니다.</p>
        <a class="back" href="../index.html">메인으로 돌아가기</a>
      </section>
    </main>
    <audio id="bgm" loop preload="none">
      <source src="https://cdn.pixabay.com/download/audio/2022/02/22/audio_d1718ab41b.mp3?filename=wedding-piano-ambient-11057.mp3" type="audio/mpeg" />
      <source src="https://samplelib.com/lib/preview/mp3/sample-12s.mp3" type="audio/mpeg" />
    </audio>
    <button id="musicToggle" class="music-btn" type="button">BGM 재생</button>
    <script>
      const bgm = document.getElementById("bgm");
      const toggle = document.getElementById("musicToggle");
      bgm.volume = 0.35;
      toggle.addEventListener("click", async () => {
        if (bgm.paused) {
          try {
            await bgm.play();
            toggle.textContent = "BGM 정지";
          } catch (_e) {
            toggle.textContent = "재생 허용 필요";
          }
        } else {
          bgm.pause();
          toggle.textContent = "BGM 재생";
        }
      });
    </script>
  </body>
</html>
