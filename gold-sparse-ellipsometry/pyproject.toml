[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gold-sparse-ellipsometry"
version = "0.1.0"
description = "Portable gold content measurement via sparse ellipsometry"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "scikit-learn>=1.4",
  "pillow>=10.2",
  "click>=8.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
gse = "gse.api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
